<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PlastiVista · Image</title><script src="media-index.js"></script><style>*{box-sizing:border-box}body{margin:0;font:14px/1.5 Helvetica,Arial,sans-serif;background:#161715;color:#eee}header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:14px 24px}a{display:flex;align-items:center;min-height:44px;color:inherit;text-underline-offset:5px}button{font:inherit;color:inherit;background:transparent;border:1px solid #aaa;min-height:44px;padding:8px 15px;cursor:pointer}button:hover{background:white;color:#171817}main{padding:0 18px 20px}img{display:block;width:100%;height:calc(100dvh - 92px);object-fit:contain}body.zoomed img{width:auto;max-width:none;height:auto;margin-inline:auto}body.zoomed main{overflow:auto}button:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:4px}@media(max-width:500px){header{padding:12px 16px;gap:16px;font-size:13px}}</style></head><body><header><a id="return" href="index.html">Back to the case study</a><button type="button" id="zoom" aria-pressed="false">View at full size</button></header><main><img id="photo" alt=""></main><script>
const view = mediaIndex[new URLSearchParams(location.search).get('view')] || mediaIndex.exhibition;
document.getElementById('photo').src = `assets/${view[0]}`;
document.getElementById('photo').alt = view[1];
document.getElementById('return').href = `index.html#${view[2]}`;
document.getElementById('zoom').addEventListener('click', event => {
  const zoomed = document.body.classList.toggle('zoomed');
  event.currentTarget.setAttribute('aria-pressed', String(zoomed));
  event.currentTarget.textContent = zoomed ? 'Fit to screen' : 'View at full size';
});
</script></body></html>
